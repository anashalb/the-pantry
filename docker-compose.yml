services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: recipes_service
      POSTGRES_USER: anas
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anas -d recipes_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  recipe-service:
    build:
      context: ./recipeService
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
